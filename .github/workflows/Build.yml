name: Build Custom DyanogenMod ROM (SM-J500FN)

on:
  workflow_dispatch:
    inputs:
      rom_page_url:
        description: 'رابط صفحة الروم (AndroidFileHost أو MediaFire أو رابط مباشر)'
        required: true
        default: 'https://androidfilehost.com'
      rom_version:
        description: 'إصدار الروم (ROM Version)'
        required: true
        default: 'v1.0'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Repack Tools, APKTool & Headless Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip curl wget unzip zip brotli android-sdk-libsparse-utils simg2img img2simg p7zip-full default-jre apksigner
          
          # تثبيت متصفح Firefox الآلي لتخطي صفحات التحميل تلقائياً
          pip3 install playwright
          playwright install firefox
          playwright install-deps firefox

          # تحميل أدوات فك وضغط الصور من الروابط الرسمية الخام
          mkdir -p ~/tools
          curl -fsSL "https://githubusercontent.com" -o ~/tools/sdat2img.py
          curl -fsSL "https://githubusercontent.com" -o ~/tools/img2sdat.py
          curl -fsSL "https://githubusercontent.com" -o ~/tools/blockimgdiff.py
          curl -fsSL "https://githubusercontent.com" -o ~/tools/common.py
          curl -fsSL "https://githubusercontent.com" -o ~/tools/rangelib.py
          curl -fsSL "https://githubusercontent.com" -o ~/tools/sparse_img.py

          # تحميل أداة تعديل التطبيقات apktool
          sudo curl -fsSL "https://github.com" -o /usr/local/bin/apktool.jar
          sudo bash -c 'printf "#!/bin/bash\njava -jar /usr/local/bin/apktool.jar \"\$@\"\n" > /usr/local/bin/apktool'
          sudo chmod +x /usr/local/bin/apktool

      - name: Download Base ROM via Headless Firefox (تحميل الروم عبر متصفح فايرفوكس الآلي)
        run: |
          mkdir -p ~/rom_work/extracted ~/rom_work/system_mnt
          cat << 'EOF' > ~/tools/auto_download.py
          import sys
          import time
          from playwright.sync_api import sync_playwright

          url = sys.argv[1]
          save_path = sys.argv[2]

          with sync_playwright() as p:
              browser = p.firefox.launch(headless=True)
              context = browser.new_context(
                  accept_downloads=True,
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0"
              )
              page = context.new_page()
              print(f"Opening page: {url}")

              download_started = False

              def handle_download(download):
                  global download_started
                  download_started = True
                  print(f"Downloading file: {download.suggested_filename}...")
                  download.save_as(save_path)
                  print("Download finished successfully!")

              page.on("download", handle_download)

              try:
                  page.goto(url, timeout=60000, wait_until="domcontentloaded")
              except Exception as e:
                  print(f"Navigation triggered download directly: {e}")

              # محاولة الضغط على أزرار التحميل الشائعة في صفحات الاستضافة (مثل AndroidFileHost)
              time.sleep(5)
              selectors = [
                  "button#btn-download",
                  "a#download_btn",
                  "a.btn-download",
                  "button:has-text('Download')",
                  "a:has-text('Click here to start download')",
                  "a:has-text('Primary Download')",
                  "#dl-link"
              ]

              for _ in range(15):
                  if download_started:
                      break
                  for sel in selectors:
                      try:
                          el = page.locator(sel).first
                          if el.is_visible(timeout=1000):
                              print(f"Clicking download button: {sel}")
                              el.click()
                              break
                      except Exception:
                          pass
                  time.sleep(3)

              # انتظار اكتمال التنزيل إذا بدأ
              wait_count = 0
              while not download_started and wait_count < 30:
                  time.sleep(2)
                  wait_count += 1

              browser.close()
              if not download_started:
                  print("ERROR: Could not trigger download automatically from this page.")
                  sys.exit(1)
          EOF

          python3 ~/tools/auto_download.py "${{ github.event.inputs.rom_page_url }}" ~/rom_work/base_rom.zip
          unzip -t ~/rom_work/base_rom.zip
          unzip -q ~/rom_work/base_rom.zip -d ~/rom_work/extracted

      - name: Unpack System Image (فك ملفات النظام)
        run: |
          cd ~/rom_work/extracted
          python3 ~/tools/sdat2img.py system.transfer.list system.new.dat ~/rom_work/system.img
          sudo mount -o loop,rw ~/rom_work/system.img ~/rom_work/system_mnt

      - name: Rename App Packages to com.dyanogenmod.xxx (تغيير أسماء الحزم)
        run: |
          SYS_DIR=~/rom_work/system_mnt
          mkdir -p ~/apk_mod/keys
          
          keytool -genkey -v -keystore ~/apk_mod/keys/rom.keystore -alias romkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 -dname "CN=opwork2015, OU=Dev, O=DyanogenMod, L=Cairo, S=EG, C=EG"

          TARGET_APPS=(
            "$SYS_DIR/app/Browser/Browser.apk"
            "$SYS_DIR/app/Eleven/Eleven.apk"
            "$SYS_DIR/app/Gallery2/Gallery2.apk"
            "$SYS_DIR/app/Snap/Snap.apk"
            "$SYS_DIR/app/Email/Email.apk"
            "$SYS_DIR/app/CMWallpapers/CMWallpapers.apk"
            "$SYS_DIR/priv-app/Screencast/Screencast.apk"
            "$SYS_DIR/priv-app/AudioFX/AudioFX.apk"
          )

          for APK_PATH in "${TARGET_APPS[@]}"; do
            if [ -f "$APK_PATH" ]; then
              APP_NAME=$(basename "$APK_PATH" .apk)
              echo "Modifying package name for $APP_NAME..."
              rm -rf ~/apk_mod/work
              apktool d -f "$APK_PATH" -o ~/apk_mod/work
              
              sed -i 's/package="com\.cyanogenmod\./package="com.dyanogenmod./g' ~/apk_mod/work/AndroidManifest.xml
              sed -i 's/package="com\.android\./package="com.dyanogenmod./g' ~/apk_mod/work/AndroidManifest.xml
              sed -i 's/package="org\.cyanogenmod\./package="com.dyanogenmod./g' ~/apk_mod/work/AndroidManifest.xml
              
              apktool b ~/apk_mod/work -o ~/apk_mod/unsigned.apk
              apksigner sign --ks ~/apk_mod/keys/rom.keystore --ks-pass pass:123456 --key-pass pass:123456 --out ~/apk_mod/signed.apk ~/apk_mod/unsigned.apk
              sudo cp ~/apk_mod/signed.apk "$APK_PATH"
              sudo chmod 644 "$APK_PATH"
            fi
          done

      - name: Customize ROM & Inject Tweaks (تخصيص الروم والتحسينات)
        run: |
          ROM_NAME="${{ github.event.repository.name }}"
          ROM_VER="${{ github.event.inputs.rom_version }}"
          SYS_DIR=~/rom_work/system_mnt

          sudo sed -i "s/^ro.build.display.id=.*/ro.build.display.id=${ROM_NAME} ${ROM_VER}/g" $SYS_DIR/build.prop
          sudo sed -i "s/^ro.cm.version=.*/ro.cm.version=${ROM_NAME}-${ROM_VER}-j5nltexx/g" $SYS_DIR/build.prop
          sudo sed -i "s/^ro.modversion=.*/ro.modversion=${ROM_NAME}-${ROM_VER}/g" $SYS_DIR/build.prop
          sudo sed -i "s/^ro.build.user=.*/ro.build.user=opwork2015/g" $SYS_DIR/build.prop

          sudo bash -c "cat << EOF >> $SYS_DIR/build.prop

          # ==========================================
          # ${ROM_NAME} ${ROM_VER} - By opwork2015
          # ==========================================
          ro.config.low_ram=true
          ro.sys.fw.bg_apps_limit=16
          persist.sys.purgeable_assets=1
          debug.sf.hw=1
          debug.performance.tuning=1
          video.accelerate.hw=1
          windowsmgr.max_events_per_sec=150
          ro.max.fling_velocity=12000
          ro.min.fling_velocity=8000
          ro.ril.disable.power.collapse=0
          pm.sleep_mode=1
          wifi.supplicant_scan_interval=180
          ro.telephony.call_ring.delay=0
          ring.delay=0
          EOF"

          sudo mkdir -p $SYS_DIR/app/FDroid
          sudo curl -fsSL "https://f-droid.org" -o $SYS_DIR/app/FDroid/FDroid.apk
          sudo chmod 644 $SYS_DIR/app/FDroid/FDroid.apk

      - name: Repack System & Create Flashable ZIP
        run: |
          ROM_NAME="${{ github.event.repository.name }}"
          ROM_VER="${{ github.event.inputs.rom_version }}"
          OUT_ZIP="${ROM_NAME}-${ROM_VER}-SM-J500FN.zip"

          sudo umount ~/rom_work/system_mnt
          cd ~/rom_work/extracted
          rm -f system.new.dat system.transfer.list system.patch.dat
          
          python3 ~/tools/img2sdat.py ~/rom_work/system.img -o ~/rom_work/extracted -v 3

          cat << EOF > META-INF/com/google/android/updater-script
          ui_print("========================================");
          ui_print("   Installing ${ROM_NAME} ${ROM_VER}    ");
          ui_print("   Device: Samsung Galaxy J5 (J500FN)   ");
          ui_print("   Developer: opwork2015                ");
          ui_print("========================================");
          show_progress(0.750000, 0);
          ui_print("Formatting system...");
          unmount("/system");
          format("ext4", "EMMC", "/dev/block/bootdevice/by-name/system", "0", "/system");
          ui_print("Installing ${ROM_NAME} system...");
