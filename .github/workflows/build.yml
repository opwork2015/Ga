name: Measure ROM size (report only)

on:
  workflow_dispatch:
    inputs:
      base_zip_url:
        description: "Direct link to the CM13 zip for SM-J500FN"
        required: true
        type: string

jobs:
  measure:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Download base zip
        run: |
          curl -L --fail -o base.zip "${{ inputs.base_zip_url }}"
          ls -lh base.zip
          unzip -q base.zip -d rom

      - name: Report size per folder
        run: |
          echo "=== Top folders ==="
          du -sh rom/* | sort -hr
          echo "=== system subfolders ==="
          du -sh rom/system/* 2>/dev/null | sort -hr | head -30
          echo "=== Largest files ==="
          find rom -type f -printf "%s %p\n" | sort -nr | head -40 | awk '{printf "%.1f MB  %s\n", $1/1048576, $2}'

      - name: Save report
        run: |
          du -ah rom | sort -hr | head -200 > report.txt
          find rom -type f -printf "%s %p\n" | sort -nr | head -200 > files.txt

      - uses: actions/upload-artifact@v4
        with:
          name: size-report
          path: |
            report.txt
            files.txt
