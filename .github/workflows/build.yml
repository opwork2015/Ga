name: Auto Build dyanogenmod v3.0 (DM) Holo Classic SuperSU ROM

on:
  push:
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Step 1 - Set Cairo Timezone and Timestamp
        id: meta
        run: |
          sudo timedatectl set-timezone Africa/Cairo
          BUILD_TAG=$(date +"%Y%m%d-%H%M")
          BUILD_DATE_STR=$(date +"%a %b %d %H:%M:%S %Z %Y")
          BUILD_UTC=$(date +%s)
          echo "build_tag=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "build_date_str=$BUILD_DATE_STR" >> $GITHUB_OUTPUT
          echo "build_utc=$BUILD_UTC" >> $GITHUB_OUTPUT

      - name: Step 2 - Install Build, APK and Signing Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-pil python3-requests python3-bs4 fonts-dejavu-core curl wget unzip zip brotli android-sdk-libsparse-utils simg2img img2simg e2fsprogs p7zip-full default-jre apktool apksigner zipalign xz-utils

      - name: Step 3 - Build Unpacker, Repacker and dyanogenmod v3.0 Red Bootanimation
        run: |
          mkdir -p ~/tools
          cat << 'EOF' > ~/tools/sdat2img.py
          import sys

          def rangeset(src):
              parts = src.split(',')
              nums = list(map(int, parts))
              res = list()
              while len(nums) > 2:
                  res.append((nums.pop(1), nums.pop(1)))
              return res

          def parse_transfer_list(path):
              with open(path, 'r') as f:
                  version = int(f.readline().strip())
                  new_blocks = int(f.readline().strip())
                  if version >= 2:
                      f.readline()
                      f.readline()
                  commands = list()
                  for line in f:
                      tokens = line.strip().split(' ')
                      cmd = tokens.pop(0)
                      if cmd in ('erase', 'new', 'zero'):
                          commands.append((cmd, rangeset(tokens.pop(0))))
              return version, new_blocks, commands

          def main():
              args = list(sys.argv)
              args.pop(0)
              transfer_list = args.pop(0)
              new_dat = args.pop(0)
              output_img = args.pop(0)
              BLOCK_SIZE = 4096
              version, new_blocks, commands = parse_transfer_list(transfer_list)
              max_block = 0
              for cmd, pairs in commands:
                  for b, e in pairs:
                      if e > max_block:
                          max_block = e
              with open(output_img, 'wb') as out_f, open(new_dat, 'rb') as dat_f:
                  out_f.truncate(max_block * BLOCK_SIZE)
                  for cmd, pairs in commands:
                      if cmd == 'new':
                          for begin, end in pairs:
                              block_count = end - begin
                              out_f.seek(begin * BLOCK_SIZE)
                              out_f.write(dat_f.read(block_count * BLOCK_SIZE))
              print("Unpacked system.img successfully.")

          if __name__ == '__main__':
              main()
          EOF

          cat << 'EOF' > ~/tools/make_red_bootanim.py
          import os, zipfile
          from PIL import Image, ImageDraw, ImageFont

          os.makedirs("/tmp/bootanim/part0", exist_ok=True)
          os.makedirs("/tmp/bootanim/part1", exist_ok=True)

          W, H = 720, 1280
          RED = (229, 20, 20)
          DARK_RED = (130, 0, 0)
          BG = (0, 0, 0)
          WHITE = (255, 255, 255)

          try:
              font_title = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 54)
              font_sub = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 28)
          except Exception:
              font_title = ImageFont.load_default()
              font_sub = ImageFont.load_default()

          def draw_logo(frame_idx, total_frames):
              img = Image.new("RGB", (W, H), BG)
              draw = ImageDraw.Draw(img)
              cx, cy = W // 2, H // 2 - 80

              glow_r = 210 + int(18 * (frame_idx / max(1, total_frames - 1)))
              draw.ellipse((cx - glow_r, cy - 160, cx + glow_r, cy + 160), outline=DARK_RED, width=6)

              draw.line(((cx - 110, cy - 110), (cx - 165, cy - 210)), fill=RED, width=22)
              draw.line(((cx + 110, cy - 110), (cx + 165, cy - 210)), fill=RED, width=22)
              draw.ellipse((cx - 176, cy - 221, cx - 154, cy - 199), fill=RED)
              draw.ellipse((cx + 154, cy - 221, cx + 176, cy - 199), fill=RED)

              draw.rounded_rectangle((cx - 190, cy - 130, cx + 190, cy + 130), radius=75, fill=RED)

              draw.ellipse((cx - 125, cy - 45, cx - 45, cy + 35), fill=WHITE)
              draw.ellipse((cx + 45, cy - 45, cx + 125, cy + 35), fill=WHITE)

              draw.pieslice((cx - 28, cy + 55, cx + 28, cy + 95), start=0, end=180, fill=WHITE)

              title_text = "dyanogenmod v3.0"
              x0, y0, x1, y1 = draw.textbbox((0, 0), title_text, font=font_title)
              draw.text(((W - (x1 - x0)) // 2, cy + 210), title_text, fill=RED, font=font_title)

              sub_text = "HOLO CLASSIC RED - BY IBLAST"
              sx0, sy0, sx1, sy1 = draw.textbbox((0, 0), sub_text, font=font_sub)
              draw.text(((W - (sx1 - sx0)) // 2, cy + 280), sub_text, fill=WHITE, font=font_sub)

              return img

          for i in range(6):
              draw_logo(i, 6).save(f"/tmp/bootanim/part0/000{i}.png")

          for i in range(6):
              draw_logo(5 - i, 6).save(f"/tmp/bootanim/part1/000{i}.png")

          with open("/tmp/bootanim/desc.txt", "w") as f:
              f.write("720 1280 15\np 1 0 part0\np 0 0 part1\n")

          with zipfile.ZipFile("/tmp/bootanimation.zip", "w", compression=zipfile.ZIP_STORED) as zf:
              zf.write("/tmp/bootanim/desc.txt", "desc.txt")
              for folder in ("part0", "part1"):
                  for fn in sorted(os.listdir(f"/tmp/bootanim/{folder}")):
                      zf.write(f"/tmp/bootanim/{folder}/{fn}", f"{folder}/{fn}")
          EOF
          python3 ~/tools/make_red_bootanim.py

      - name: Step 4 - Direct API Download Base ROM and SuperSU
        run: |
          mkdir -p ~/rom_work/extracted ~/rom_work/system_mnt ~/supersu
          cat << 'EOF' > ~/tools/afh_api_dl.py
          import sys, requests

          fid = "745425885120710285"
          save_path = "/home/runner/rom_work/base_rom.zip"
          session = requests.Session()
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Referer": "https://androidfilehost.com" + fid,
              "X-Requested-With": "XMLHttpRequest"
          }

          print("Requesting mirror list from AFH API...")
          session.get("https://androidfilehost.com" + fid, headers=headers, timeout=30)
          resp = session.post(
              "https://androidfilehost.com",
              data={"submit": "submit", "action": "getdownloadmirrors", "fid": fid},
              headers=headers,
              timeout=30
          )

          data = resp.json()
          mirrors = data.get("MIRRORS", list())
          print("Mirrors found:", len(mirrors))

          downloaded = False
          for m in mirrors:
              dl_url = m.get("url")
              if not dl_url:
                  continue
              print("Downloading from mirror:", dl_url)
              try:
                  with session.get(dl_url, headers=headers, stream=True, timeout=60) as r:
                      if r.status_code == 200 and "text/html" not in r.headers.get("Content-Type", ""):
                          with open(save_path, "wb") as f:
                              for chunk in r.iter_content(chunk_size=1048576):
                                  if chunk:
                                      f.write(chunk)
                          downloaded = True
                          print("Download completed successfully!")
                          break
              except Exception as e:
                  print("Mirror failed:", e)

          if not downloaded:
              print("ERROR: All mirrors failed.")
              sys.exit(1)
          EOF

          python3 ~/tools/afh_api_dl.py
          unzip -t ~/rom_work/base_rom.zip || true
          unzip -q ~/rom_work/base_rom.zip -d ~/rom_work/extracted || true

          # تحميل حزمة SuperSU البديلة والموثوقة في حال تعذر الموقع الأساسي
          curl -fsSL "https://download.chainfire.eu/1220/SuperSU/SR5-SuperSU-v2.82-20171001224502.zip" -o ~/supersu/supersu.zip || \
          curl -fsSL "https://github.com/MK2000/SuperSU/raw/master/SR5-SuperSU-v2.82-20171001224502.zip" -o ~/supersu/supersu.zip || true
          if test -f ~/supersu/supersu.zip; then
            unzip -q ~/supersu/supersu.zip -d ~/supersu/extracted || true
          fi

      - name: Step 5 - Remove Other Device Variants and Keep SM-J500FN Only
        run: |
          cd ~/rom_work/extracted
          if test -d "variants" || test -d "devices"; then
            find . -type f \( -iname "*j5nlte*" -o -iname "*j500fn*" \) -exec cp {} . \; || true
            rm -rf variants devices
          fi
          find . -maxdepth 3 \( -iname "*j5lte*" -o -iname "*j53g*" -o -iname "*j5ltechn*" -o -iname "*j5ylte*" -o -iname "*j500f*" -o -iname "*j500g*" -o -iname "*j500h*" -o -iname "*j500m*" \) ! -iname "*j5nlte*" ! -iname "*j500fn*" -exec rm -rf {} + || true
          find . -maxdepth 2 -type f \( -iname "*.txt" -o -iname "*.md" -o -iname "changelog*" \) -exec rm -f {} + || true

      - name: Step 6 - Unpack System Image, Inject SuperSU and Red Bootanimation
        run: |
          cd ~/rom_work/extracted
          if test -f "system.new.dat"; then
            python3 ~/tools/sdat2img.py system.transfer.list system.new.dat ~/rom_work/system.img
          elif test -f "system.img"; then
            cp system.img ~/rom_work/system.img
          fi

          mkdir -p ~/rom_work/system_mnt
          sudo mount -o loop ~/rom_work/system.img ~/rom_work/system_mnt || {
            sudo ext2simg ~/rom_work/system.img ~/rom_work/system_ext4.img || true
            sudo mount -o loop ~/rom_work/system_ext4.img ~/rom_work/system_mnt || true
          }

          # حقن ثيم التشغيل الأحمر (Bootanimation)
          if test -f /tmp/bootanimation.zip; then
            sudo mkdir -p ~/rom_work/system_mnt/media ~/rom_work/system_mnt/system/media
            sudo cp /tmp/bootanimation.zip ~/rom_work/system_mnt/system/media/bootanimation.zip
            sudo chmod 644 ~/rom_work/system_mnt/system/media/bootanimation.zip
          fi

          # دمج صلاحيات SuperSU
          if test -d ~/supersu/extracted/common; then
            sudo cp -af ~/supersu/extracted/common/. ~/rom_work/system_mnt/
            sudo mkdir -p ~/rom_work/system_mnt/app/Superuser
            if test -f ~/supersu/extracted/common/su.apk; then
              sudo cp ~/supersu/extracted/common/su.apk ~/rom_work/system_mnt/app/Superuser/Superuser.apk
              sudo chmod 644 ~/rom_work/system_mnt/app/Superuser/Superuser.apk
            fi
          fi

          # تعديل build.prop لاسم dyanogenmod v3.0 Holo Classic
          sudo sed -i 's/ro.build.display.id=.*/ro.build.display.id=dyanogenmod v3.0 SM-J500FN Holo Classic/g' ~/rom_work/system_mnt/build.prop || true
          sudo sed -i 's/ro.modversion=.*/ro.modversion=dyanogenmod-v3.0-J500FN/g' ~/rom_work/system_mnt/build.prop || true

          # إعادة ضغط نظام الـ img
          sudo umount ~/rom_work/system_mnt || true
          mkfs.etfsprogs -b 4096 -F ~/rom_work/system.img || true

      - name: Step 7 - Create Final Flashable ROM Zip Package
        run: |
          mkdir -p ~/final_rom
          cd ~/rom_work/extracted
          zip -r9 ~/final_rom/dyanogenmod-v3.0-J500FN-HoloClassic-SuperSU.zip .
          cd ~/final_rom
          md5sum dyanogenmod-v3.0-J500FN-HoloClassic-SuperSU.zip > dyanogenmod-v3.0-J500FN-HoloClassic-SuperSU.zip.md5

      - name: Step 8 - Generate Lightweight WebView Red HTML Download Page
        run: |
          mkdir -p ~/output_web
          cat << 'EOF' > ~/output_web/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>dyanogenmod v3.0 - SM-J500FN</title>
              <style>
                  body {
                      background-color: #121212;
                      color: #ffffff;
                      font-family: Tahoma, sans-serif;
                      text-align: center;
                      padding: 20px;
                      margin: 0;
                  }
                  .container {
                      max-width: 400px;
                      margin: 40px auto;
                      background: #1e1e1e;
                      border: 2px solid #e51414;
                      border-radius: 12px;
                      padding: 20px;
                      box-shadow: 0 4px 15px rgba(229, 20, 20, 0.4);
                  }
                  h1 { color: #e51414; font-size: 22px; margin-bottom: 5px; }
                  p { color: #bbbbbb; font-size: 14px; }
                  .btn {
                      display: block;
                      width: 100%;
                      background-color: #e51414;
                      color: white;
                      padding: 14px 0;
                      font-size: 16px;
                      font-weight: bold;
                      text-decoration: none;
                      border-radius: 8px;
                      margin-top: 20px;
                      box-sizing: border-box;
                      transition: background 0.2s;
                  }
                  .btn:active { background-color: #b30f0f; }
                  .badge {
                      display: inline-block;
                      background: #330000;
                      color: #ff6b6b;
                      padding: 4px 10px;
                      border-radius: 4px;
                      font-size: 12px;
                      margin-top: 10px;
                  }
              </style>
          </main>
          <body>
              <div class="container">
                  <h1>dyanogenmod v3.0</h1>
                  <p>Holo Classic Red • SuperSU Root • SM-J500FN</p>
                  <div class="badge">جهاز خفيف علي الرام ومناسب للـ WebView</div>
                  <a href="./dyanogenmod-v3.0-J500FN-HoloClassic-SuperSU.zip" class="btn">تنزيل الروم الجاهز (.ZIP)</a>
              </div>
          </body>
          </html>
          EOF
          cp ~/final_rom/dyanogenmod-v3.0-J500FN-HoloClassic-SuperSU.zip ~/output_web/

      - name: Step 9 - Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dyanogenmod-v3.0-J500FN-ROM-Package
          path: ~/output_web/
