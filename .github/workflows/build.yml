name: ROM Structure & Config Inspector

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'ضع هنا رابط تحميل ملف الـ ZIP للروم مباشرة:'
        required: true
        default: 'https://github.com/opwork2015/Ga/raw/main/base_rom.zip'

jobs:
  inspect-rom:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Advanced Ubuntu Compression Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip p7zip-full p7zip-rar curl wget

    - name: Run Robust ROM Inspection Script
      run: |
        node -e '
        const fs = require("fs");
        const path = require("path");
        const { execSync } = require("child_process");

        const romUrl = "${{ github.event.inputs.rom_url }}";
        console.log(`[*] جاري تحميل الروم من الرابط: ${romUrl}`);
        
        // التحميل مع متابعة إعادة التوجيه واستخدام UA متصفح حقيقي
        try {
            execSync(`curl -L -A "Mozilla/5.0" -o base_rom.zip "${romUrl}"`, { stdio: "inherit" });
        } catch (e) {
            console.error("[-] فشل التحميل عبر الـ curl.");
            process.exit(1);
        }

        // التأكد من أن الملف المحمل ليس صفحة HTML بل ملف مضغوط حقيقي
        const stats = fs.statSync("base_rom.zip");
        console.log(`[*] حجم الملف المحمل: ${stats.size} بايت`);
        
        if (stats.size < 1000000) {
            console.error("[-] خطأ: الملف المحمل صغير جداً أو عبارة عن صفحة خطأ/تحويل (HTML). يرجى التأكد من أن الرابط مباشر تماماً.");
            // طباعة عينة من المحتوى لمعرفة الخطأ
            const contentSample = fs.readFileSync("base_rom.zip", "utf8").substring(0, 200);
            console.error("محتوى الملف المحمل:\n" + contentSample);
            process.exit(1);
        }

        if (!fs.existsSync("rom_extracted")) fs.mkdirSync("rom_extracted");
        
        console.log("[*] جاري فك ضغط الروم باستخدام أدوات أوبونتو القوية (7z / unzip)...");
        let extractedOk = false;
        
        try {
            // محاولة الفك بـ 7z (تدعم كافة أنواع الضغط المضغوطة للرومات)
            execSync("7z x base_rom.zip -orom_extracted -y", { stdio: "inherit" });
            extractedOk = true;
        } catch (e) {
            console.log("[*] فشل 7z، جاري المحاولة باستخدام أداة unzip الكلاسيكية...");
            try {
                execSync("unzip -q base_rom.zip -d rom_extracted", { stdio: "inherit" });
                extractedOk = true;
            } catch (err) {
                console.error("[-] فشل فك الضغط بجميع الأدوات.");
            }
        }

        if (!extractedOk) {
            console.error("[-] خطأ: تعذر فك ضغط ملف الروم.");
            process.exit(1);
        }

        console.log("[*] جاري إنشاء التقرير الشامل لمسارات الملفات، التوقيعات، و الملفات المطلوبة...");
        
        let report = "# 🔍 تقرير فحص ومسارات الروم الشامل\n\n";
        report += `**رابط الروم:** \`${romUrl}\`\n\n`;
        report += "---\n\n";

        // 1. مسارات جميع الملفات
        report += "## 📂 مسارات جميع الملفات داخل الروم:\n\n```text\n";
        function getAllFiles(dir, baseDir = dir) {
            let results = [];
            let list = fs.readdirSync(dir);
            list.forEach(file => {
                let filePath = path.join(dir, file);
                let stat = fs.statSync(filePath);
                if (stat && stat.isDirectory()) {
                    results = results.concat(getAllFiles(filePath, baseDir));
                } else {
                    results.push(path.relative(baseDir, filePath));
                }
            });
            return results;
        }
        
        const allFiles = getAllFiles("rom_extracted");
        allFiles.sort();
        report += allFiles.join("\n");
        report += "\n```\n\n---\n\n";

        // 2. التوقيعات وشهادات الأمان
        report += "## 🔐 التوقيعات وشهادات الأمان (META-INF):\n\n";
        const sigFiles = allFiles.filter(f => f.startsWith("META-INF/") || f.endsWith(".RSA") || f.endsWith(".SF") || f.endsWith(".MF"));
        if (sigFiles.length > 0) {
            sigFiles.forEach(sf => report += `- \`${sf}\`\n`);
        } else {
            report += "لم يتم العثور على ملفات توقيع ظاهرة.\n";
        }
        report += "\n---\n\n";

        // 3. كود build.prop
        report += "## ⚙️ محتوى ملف build.prop:\n\n```text\n";
        const buildPropCmd = execSync("find rom_extracted -name 'build.prop'").toString().trim().split("\n")[0];
        if (buildPropCmd && fs.existsSync(buildPropCmd)) {
            report += fs.readFileSync(buildPropCmd, "utf8");
        } else {
            report += "ملف build.prop غير موجود في هذا الروم.\n";
        }
        report += "\n```\n\n---\n\n";

        // 4. كود updater-script
        report += "## 📜 محتوى ملف updater-script:\n\n```text\n";
        const updaterCmd = execSync("find rom_extracted -name 'updater-script'").toString().trim().split("\n")[0];
        if (updaterCmd && fs.existsSync(updaterCmd)) {
            report += fs.readFileSync(updaterCmd, "utf8");
        } else {
            report += "ملف updater-script غير موجود.\n";
        }
        report += "\n```\n";

        if (!fs.existsSync("output")) fs.mkdirSync("output");
        fs.writeFileSync("output/rom_detailed_report.md", report, "utf8");
        console.log("[+] تم إنشاء التقرير المفصل بنجاح في output/rom_detailed_report.md");
        '

    - name: Upload Detailed ROM Report
      uses: actions/upload-artifact@v4
      with:
        name: ROM_Detailed_Report
        path: output/rom_detailed_report.md
