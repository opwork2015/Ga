name: Build DyanogenMod from my base zip

on:
  workflow_dispatch:
    inputs:
      base_zip_url:
        description: "Direct link to a full 6.0.1 flashable zip for SM-J500FN"
        required: true
        type: string
      rom_name:
        description: "Output name"
        required: true
        default: "DyanogenMod-6.0.1-J500FN"
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip curl

      - name: Download base ROM
        run: |
          curl -L --fail -o base.zip "${{ inputs.base_zip_url }}"
          unzip -tq base.zip
          mkdir -p base && unzip -q base.zip -d base
          ls -la base

      - name: Check required parts exist
        run: |
          test -f base/META-INF/com/google/android/update-binary || (echo "::error::update-binary missing in base zip" && exit 1)
          test -f base/META-INF/com/google/android/updater-script || (echo "::error::updater-script missing in base zip" && exit 1)
          echo "Base ROM structure OK"

      - name: Apply my overlay
        run: |
          mkdir -p rom
          cp -r base/. rom/
          if [ -d overlay ]; then
            cp -r overlay/. rom/
            echo "Overlay applied:"
            find overlay -type f
          else
            echo "No overlay folder, base copied as-is"
          fi

      - name: Check build.prop
        run: |
          if [ -f rom/system/build.prop ]; then
            grep -E "^ro\.(build\.display\.id|product\.model|modversion)=" rom/system/build.prop || true
          else
            echo "::warning::system/build.prop not found in rom"
          fi

      - name: Pack flashable zip
        run: |
          mkdir -p out
          cd rom && zip -qr -0 ../out/${{ inputs.rom_name }}.zip . && cd ..
          cd out && md5sum ${{ inputs.rom_name }}.zip > ${{ inputs.rom_name }}.zip.md5 && cd ..
          ls -lh out

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.rom_name }}
          path: out/
          retention-days: 14
