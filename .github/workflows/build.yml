name: Build Micro DyanogenMod ROM (SM-J500FN Only)

on:
  workflow_dispatch:
    inputs:
      afh_file_id:
        description: 'رقم ملف AndroidFileHost (FID)'
        required: true
        default: '745425885120710285'
      rom_version:
        description: 'إصدار الروم (ROM Version)'
        required: true
        default: 'v1.0'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Tools & Headless Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip curl wget unzip zip brotli \
            android-sdk-libsparse-utils simg2img img2simg e2fsprogs p7zip-full \
            default-jre apktool apksigner xz-utils
          pip3 install playwright
          playwright install firefox
          playwright install-deps firefox

      - name: Create Built-in Unpack Tool
        run: |
          mkdir -p ~/tools
          cat << 'EOF' > ~/tools/sdat2img.py
          #!/usr/bin/env python3
          import sys

          def rangeset(src):
              src_set = src.split(',')
              num_set = [int(item) for item in src_set]
              return tuple([(num_set[i], num_set[i+1]) for i in range(1, len(num_set), 2)])

          def parse_transfer_list(path):
              with open(path, 'r') as f:
                  version = int(f.readline())
                  new_blocks = int(f.readline())
                  if version >= 2:
                      f.readline()
                      f.readline()
                  commands = []
                  for line in f:
                      parts = line.strip().split(' ')
                      if parts[0] in ['erase', 'new', 'zero']:
                          commands.append([parts[0], rangeset(parts[1])])
              return version, new_blocks, commands

          def main(transfer_list, new_dat, output_img):
              BLOCK_SIZE = 4096
              version, new_blocks, commands = parse_transfer_list(transfer_list)
              with open(output_img, 'wb') as out_f, open(new_dat, 'rb') as dat_f:
                  all_blocks = [item for cmd in commands for item in cmd[1]]
                  max_block = max(pair[1] for pair in all_blocks)
                  out_f.truncate(max_block * BLOCK_SIZE)
                  for cmd in commands:
                      if cmd[0] == 'new':
                          for begin, end in cmd[1]:
                              block_count = end - begin
                              out_f.seek(begin * BLOCK_SIZE)
                              out_f.write(dat_f.read(block_count * BLOCK_SIZE))
              print("Unpacked system.img successfully.")

          if __name__ == '__main__':
              main(sys.argv[1], sys.argv[2], sys.argv[3])
          EOF
          chmod +x ~/tools/sdat2img.py

      - name: Download Base ROM from AndroidFileHost via Firefox
        run: |
          mkdir -p ~/rom_work/extracted ~/rom_work/system_mnt
          FID="${{ github.event.inputs.afh_file_id }}"
          TARGET_URL="https://androidfilehost.com{FID}"

          cat << 'EOF' > ~/tools/afh_download.py
          import sys, time
          from playwright.sync_api import sync_playwright

          url = sys.argv[1]
          save_path = sys.argv[2]

          with sync_playwright() as p:
              browser = p.firefox.launch(headless=True)
              context = browser.new_context(
                  accept_downloads=True,
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:128.0) Gecko/20100101 Firefox/128.0"
              )
              page = context.new_page()
              print(f"Opening exact URL: {url}")
              download_started = False

              def handle_download(download):
                  global download_started
                  download_started = True
                  print(f"Downloading: {download.suggested_filename}...")
                  download.save_as(save_path)
                  print("Download finished!")

              page.on("download", handle_download)
              page.goto(url, timeout=60000, wait_until="networkidle")
              time.sleep(3)

              start_btn = page.locator("a:has-text('Click Here to Start Download'), button#btn-download").first
              if start_btn.is_visible(timeout=10000):
                  print("Clicking 'Click Here to Start Download'...")
                  start_btn.click()

              time.sleep(8)
              mirror_links = page.locator("#mirrors a, a[href*='://androidfilehost.com']")
              count = mirror_links.count()
              print(f"Found {count} mirror links.")
              for i in range(count):
                  if download_started:
                      break
                  try:
                      print(f"Trying mirror {i+1}...")
                      mirror_links.nth(i).click(timeout=5000)
                      time.sleep(5)
                  except Exception as e:
                      print(f"Mirror {i+1} skipped: {e}")

              wait_count = 0
              while not download_started and wait_count  $SYS_DIR/build.prop

          # ${ROM_NAME} ${ROM_VER} (SM-J500FN Only) - By opwork2015
          ro.config.low_ram=true
