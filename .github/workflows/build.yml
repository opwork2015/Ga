name: Auto Build dyanogenmod v3.0 (DM) Holo Classic SuperSU ROM

on:
  push:
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Step 1 - Set Cairo Timezone and Timestamp
        id: meta
        run: |
          sudo timedatectl set-timezone Africa/Cairo
          BUILD_TAG=$(date +"%Y%m%d-%H%M")
          BUILD_DATE_STR=$(date +"%a %b %d %H:%M:%S %Z %Y")
          BUILD_UTC=$(date +%s)
          echo "build_tag=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "build_date_str=$BUILD_DATE_STR" >> $GITHUB_OUTPUT
          echo "build_utc=$BUILD_UTC" >> $GITHUB_OUTPUT

      - name: Step 2 - Install Build, APK, Signing and Lightweight WebView Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-pip python3-pil python3-requests python3-bs4 fonts-dejavu-core curl wget unzip zip brotli android-sdk-libsparse-utils simg2img img2simg e2fsprogs p7zip-full default-jre apktool apksigner zipalign xz-utils
          pip3 install -q playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Step 3 - Build Unpacker and dyanogenmod v3.0 Red Bootanimation
        run: |
          mkdir -p ~/tools
          cat << 'EOF' > ~/tools/sdat2img.py
          import sys

          def rangeset(src):
              parts = src.split(',')
              nums = list(map(int, parts))
              res = []
              while len(nums) > 2:
                  res.append((nums.pop(1), nums.pop(1)))
              return res

          def parse_transfer_list(path):
              with open(path, 'r') as f:
                  version = int(f.readline().strip())
                  new_blocks = int(f.readline().strip())
                  if version >= 2:
                      f.readline()
                      f.readline()
                  commands = []
                  for line in f:
                      tokens = line.strip().split(' ')
                      if not tokens or not tokens[0]:
                          continue
                      cmd = tokens.pop(0)
                      if cmd in ('erase', 'new', 'zero'):
                          commands.append((cmd, rangeset(tokens.pop(0))))
              return version, new_blocks, commands

          def main():
              if len(sys.argv) < 4:
                  sys.exit("Usage: sdat2img.py <transfer_list> <system_new_dat> <system_img>")
              transfer_list, new_dat, output_img = sys.argv[1], sys.argv[2], sys.argv[3]
              BLOCK_SIZE = 4096
              version, new_blocks, commands = parse_transfer_list(transfer_list)
              max_block = max((e for _, pairs in commands for _, e in pairs), default=0)
              with open(output_img, 'wb') as out_f, open(new_dat, 'rb') as dat_f:
                  out_f.truncate(max_block * BLOCK_SIZE)
                  for cmd, pairs in commands:
                      if cmd == 'new':
                          for begin, end in pairs:
                              block_count = end - begin
                              out_f.seek(begin * BLOCK_SIZE)
                              out_f.write(dat_f.read(block_count * BLOCK_SIZE))
              print("Unpacked system.img successfully.")

          if __name__ == '__main__':
              main()
          EOF

          cat << 'EOF' > ~/tools/make_red_bootanim.py
          import os, zipfile
          from PIL import Image, ImageDraw, ImageFont

          os.makedirs("/tmp/bootanim/part0", exist_ok=True)
          os.makedirs("/tmp/bootanim/part1", exist_ok=True)

          W, H = 720, 1280
          RED = (229, 20, 20)
          DARK_RED = (130, 0, 0)
          BG = (0, 0, 0)
          WHITE = (255, 255, 255)

          try:
              font_title = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 54)
              font_sub = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 28)
          except Exception:
              font_title = ImageFont.load_default()
              font_sub = ImageFont.load_default()

          def draw_logo(frame_idx, total_frames):
              img = Image.new("RGB", (W, H), BG)
              draw = ImageDraw.Draw(img)
              cx, cy = W // 2, H // 2 - 80

              glow_r = 210 + int(18 * (frame_idx / max(1, total_frames - 1)))
              draw.ellipse((cx - glow_r, cy - 160, cx + glow_r, cy + 160), outline=DARK_RED, width=6)

              draw.line(((cx - 110, cy - 110), (cx - 165, cy - 210)), fill=RED, width=22)
              draw.line(((cx + 110, cy - 110), (cx + 165, cy - 210)), fill=RED, width=22)
              draw.ellipse((cx - 176, cy - 221, cx - 154, cy - 199), fill=RED)
              draw.ellipse((cx + 154, cy - 221, cx + 176, cy - 199), fill=RED)

              draw.rounded_rectangle((cx - 190, cy - 130, cx + 190, cy + 130), radius=75, fill=RED)

              draw.ellipse((cx - 125, cy - 45, cx - 45, cy + 35), fill=WHITE)
              draw.ellipse((cx + 45, cy - 45, cx + 125, cy + 35), fill=WHITE)

              draw.pieslice((cx - 28, cy + 55, cx + 28, cy + 95), start=0, end=180, fill=WHITE)

              title_text = "dyanogenmod v3.0"
              x0, y0, x1, y1 = draw.textbbox((0, 0), title_text, font=font_title)
              draw.text(((W - (x1 - x0)) // 2, cy + 210), title_text, fill=RED, font=font_title)

              sub_text = "HOLO CLASSIC RED - BY IBLAST"
              sx0, sy0, sx1, sy1 = draw.textbbox((0, 0), sub_text, font=font_sub)
              draw.text(((W - (sx1 - sx0)) // 2, cy + 280), sub_text, fill=WHITE, font=font_sub)

              return img

          for i in range(6):
              draw_logo(i, 6).save(f"/tmp/bootanim/part0/000{i}.png")

          for i in range(6):
              draw_logo(5 - i, 6).save(f"/tmp/bootanim/part1/000{i}.png")

          with open("/tmp/bootanim/desc.txt", "w") as f:
              f.write("720 1280 15\np 1 0 part0\np 0 0 part1\n")

          with zipfile.ZipFile("/tmp/bootanimation.zip", "w", compression=zipfile.ZIP_STORED) as zf:
              zf.write("/tmp/bootanim/desc.txt", "desc.txt")
              for folder in ("part0", "part1"):
                  for fn in sorted(os.listdir(f"/tmp/bootanim/{folder}")):
                      zf.write(f"/tmp/bootanim/{folder}/{fn}", f"{folder}/{fn}")
          EOF
          python3 ~/tools/make_red_bootanim.py

      - name: Step 4 - Lightweight Headless WebView Download Base ROM and SuperSU
        run: |
          mkdir -p ~/rom_work/extracted ~/rom_work/system_mnt ~/supersu/extracted
          cat << 'EOF' > ~/tools/afh_webview_dl.py
          import os, sys, time, requests
          from playwright.sync_api import sync_playwright

          fid = "745425885120710285"
          target_url = f"https://androidfilehost.com/?fid={fid}"
          save_path = "/home/runner/rom_work/base_rom.zip"

          # إعدادات متصفح خفيف جداً على الرام (تعطيل الصور والخطوط والوسائط)
          browser_args = [
              "--no-sandbox",
              "--disable-dev-shm-usage",
              "--disable-gpu",
              "--disable-extensions",
              "--disable-background-networking",
              "--disable-sync",
              "--disable-default-apps",
              "--mute-audio",
              "--no-first-run",
              "--single-process"
          ]

          print("Launching lightweight headless WebView...")
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=browser_args)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                  accept_downloads=True
              )
              page = context.new_page()

              # حظر تحميل الصور والأنماط لتقليل استهلاك الرام وتسريع الصفحة
              page.route("**/*", lambda route: route.abort() if route.request.resource_type in ["image", "stylesheet", "font", "media"] else route.continue_())

              print(f"Navigating to {target_url} ...")
              page.goto(target_url, wait_until="domcontentloaded", timeout=60000)

              # انتظار ظهور زر التحميل الرئيسي والضغط عليه
              print("Waiting for primary download button...")
              dl_btn = page.locator("#download-btn, button:has-text('Click Here to Start Download'), a:has-text('Click Here to Start Download')").first
              dl_btn.wait_for(state="visible", timeout=30000)
              dl_btn.click()
              print("Clicked primary download button. Waiting for mirrors to generate...")

              # انتظار ظهور روابط السيرفرات المباشرة بعد الضغط على الزر
              page.wait_for_selector("#mirrors a[href^='http']", timeout=45000)
              mirror_elements = page.locator("#mirrors a[href^='http']").all()
              mirror_urls = [el.get_attribute("href") for el in mirror_elements if el.get_attribute("href")]

              # استخراج الكوكيز من الـ WebView لاستخدامها في التحميل السريع
              cookies = {c['name']: c['value'] for c in context.cookies()}
              browser.close()
              print("WebView closed to free RAM. Mirrors found:", len(mirror_urls))

          if not mirror_urls:
              print("ERROR: No mirror links generated after button click.")
              sys.exit(1)

          session = requests.Session()
          session.cookies.update(cookies)
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Referer": target_url
          }

          downloaded = False
          for dl_url in mirror_urls:
              print("Downloading from mirror:", dl_url)
              try:
