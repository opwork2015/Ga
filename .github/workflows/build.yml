name: ROM Structure & Config Inspector

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'ضع هنا رابط تحميل ملف الـ ZIP للروم مباشرة:'
        required: true
        default: 'https://github.com/opwork2015/Ga/releases/download/v1.0/base_rom.zip'

jobs:
  inspect-rom:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip curl

    - name: Run ROM Inspection Script
      run: |
        node -e '
        const fs = require("fs");
        const path = require("path");
        const { execSync } = require("child_process");

        const romUrl = "${{ github.event.inputs.rom_url }}";
        console.log(`[*] جاري تحميل الروم من الرابط: ${romUrl}`);
        
        try {
            execSync(`curl -L -o base_rom.zip "${romUrl}"`, { stdio: "inherit" });
        } catch (e) {
            console.error("[-] فشل تحميل الملف من الرابط.");
            process.exit(1);
        }

        if (!fs.existsSync("base_rom.zip") || fs.statSync("base_rom.zip").size < 1000) {
            console.error("[-] خطأ: الملف المحمل تالف أو غير موجود.");
            process.exit(1);
        }

        if (!fs.existsSync("rom_extracted")) fs.mkdirSync("rom_extracted");
        console.log("[*] جاري فك ضغط الروم...");
        try {
            execSync("unzip -q base_rom.zip -d rom_extracted", { stdio: "inherit" });
        } catch (e) {
            console.error("[-] خطأ في فك ضغط ملف الـ ZIP.");
            process.exit(1);
        }

        console.log("[*] جاري استخراج مسارات الملفات، التوقيعات، و الملفات المطلوبة...");
        
        let report = "# 🔍 تقرير فحص ومسارات الروم الشامل\n\n";
        report += `**رابط الروم:** \`${romUrl}\`\n\n`;
        report += "---\n\n";

        // 1. مسارات جميع الملفات
        report += "## 📂 مسارات جميع الملفات داخل الروم:\n\n```text\n";
        function getAllFiles(dir, baseDir = dir) {
            let results = [];
            let list = fs.readdirSync(dir);
            list.forEach(file => {
                let filePath = path.join(dir, file);
                let stat = fs.statSync(filePath);
                if (stat && stat.isDirectory()) {
                    results = results.concat(getAllFiles(filePath, baseDir));
                } else {
                    results.push(path.relative(baseDir, filePath));
                }
            });
            return results;
        }
        
        const allFiles = getAllFiles("rom_extracted");
        allFiles.sort();
        report += allFiles.join("\n");
        report += "\n```\n\n---\n\n";

        // 2. البحث عن التوقيعات والشهادات
        report += "## 🔐 التوقيعات وشهادات الأمان (META-INF):\n\n";
        const sigFiles = allFiles.filter(f => f.startsWith("META-INF/") || f.endsWith(".RSA") || f.endsWith(".SF") || f.endsWith(".MF"));
        if (sigFiles.length > 0) {
            sigFiles.forEach(sf => report += `- \`${sf}\`\n`);
        } else {
            report += "لم يتم العثور على ملفات توقيع ظاهرة.\n";
        }
        report += "\n---\n\n";

        // 3. كود build.prop
        report += "## ⚙️ محتوى ملف build.prop:\n\n```text\n";
        const buildPropCmd = execSync("find rom_extracted -name 'build.prop'").toString().trim().split("\n")[0];
        if (buildPropCmd && fs.existsSync(buildPropCmd)) {
            report += fs.readFileSync(buildPropCmd, "utf8");
        } else {
            report += "ملف build.prop غير موجود في هذا الروم.\n";
        }
        report += "\n```\n\n---\n\n";

        // 4. كود updater-script
        report += "## 📜 محتوى ملف updater-script:\n\n```text\n";
        const updaterCmd = execSync("find rom_extracted -name 'updater-script'").toString().trim().split("\n")[0];
        if (updaterCmd && fs.existsSync(updaterCmd)) {
            report += fs.readFileSync(updaterCmd, "utf8");
        } else {
            report += "ملف updater-script غير موجود (قد يكون روم يعتمد على edify مختلف أو تحديث حديث).\n";
        }
        report += "\n```\n";

        if (!fs.existsSync("output")) fs.mkdirSync("output");
        fs.writeFileSync("output/rom_detailed_report.md", report, "utf8");
        console.log("[+] تم إنشاء التقرير المفصل بنجاح.");
        '

    - name: Upload Detailed ROM Report
      uses: actions/upload-artifact@v4
      with:
        name: ROM_Detailed_Report
        path: output/rom_detailed_report.md
